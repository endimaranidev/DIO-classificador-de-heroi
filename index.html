<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificador de Nível de Herói</title>

    <!-- CSS -->
     <link rel="stylesheet" href="./css/reset.css">
     <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h1>Classificador de Nível de Herói</h1>

    <div class="hero-data">
        <input class="hero-data__name" type="text" name="name" id="name" placeholder="Nome do Herói" required>
        <input class="hero-data__exp" type="number" name="exp" id="exp" placeholder="XP do Herói" required>

    <button class="hero-data__button" type="button">Ver Classificação</button>
    </div>

    <p class="hero-classification"></p>

    <img src="" alt="" id="hero-img">
    
    <script src="./script/script.js"></script>
</body>
</html>
